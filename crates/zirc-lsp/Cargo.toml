[package]
name = "zirc-lsp"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Language server for the Zirc programming language"
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "zirc-lsp"
path = "src/main.rs"

[dependencies]
zirc-syntax.workspace = true
zirc-lexer.workspace = true
zirc-parser.workspace = true
zirc-bytecode.workspace = true
zirc-lint.workspace = true
zirc-fmt.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
