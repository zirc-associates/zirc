[package]
name = "zirc-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Command-line interface and REPL for the Zirc programming language"
keywords.workspace = true
categories.workspace = true
autobins = false
default-run = "zirc"

[[bin]]
name = "zirc"
path = "src/main.rs"

[[bin]]
name = "zirc-repl"
path = "src/repl_main.rs"

[dependencies]
zirc-lexer.workspace = true
zirc-parser.workspace = true
zirc-interpreter.workspace = true
zirc-syntax.workspace = true
zirc-bytecode.workspace = true
zirc-compiler.workspace = true
zirc-vm.workspace = true
zirc-loader.workspace = true
owo-colors.workspace = true
clap.workspace = true

[target.'cfg(windows)'.dependencies]
windows.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
tempfile.workspace = true
zirc-syntax.workspace = true
zirc-lexer.workspace = true
zirc-parser.workspace = true
zirc-loader.workspace = true
zirc-interpreter.workspace = true
zirc-compiler.workspace = true
zirc-bytecode.workspace = true
zirc-vm.workspace = true
